<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Train Finder – South India</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef1f4;--card:#fff;--ink:#12263a;--mute:#5b6b7a;--line:#d5dce3;--sig:#ffc400;--on-sig:#12263a;--panel:#12263a;--on-panel:#fff;--ok:#1e7b4f;--bad:#b3261e;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1822;--card:#16273a;--ink:#e8eef4;--mute:#9db0c2;--line:#2a3d52;--panel:#1b3148;--ok:#5fd39a;--bad:#ff8a80;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e1822;--card:#16273a;--ink:#e8eef4;--mute:#9db0c2;--line:#2a3d52;--panel:#1b3148;--ok:#5fd39a;--bad:#ff8a80;color-scheme:dark}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 Barlow,system-ui,sans-serif}
.wrap{max-width:760px;margin:0 auto;padding:0 16px 48px}
header{padding:28px 0 18px}
h1{font:700 40px/1 "Barlow Condensed",Impact,sans-serif;margin:0 0 6px;letter-spacing:.2px}
header p{margin:0;color:var(--mute)}
.panel{background:var(--panel);color:var(--on-panel);border-radius:10px;padding:18px;border-bottom:6px solid var(--sig)}
.row{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:end}
.f{display:flex;flex-direction:column;gap:4px;min-width:0}
label{font-size:14px;font-weight:500;opacity:.85}
input{width:100%;font:500 18px Barlow,system-ui,sans-serif;padding:11px 12px;border:2px solid transparent;border-radius:6px;background:#fff;color:#12263a}
input:focus-visible,button:focus-visible,summary:focus-visible{outline:3px solid var(--sig);outline-offset:2px}
.swap{height:46px;width:46px;border-radius:6px;border:2px solid rgba(255,255,255,.4);background:transparent;color:#fff;font-size:20px;cursor:pointer}
.row2{display:flex;gap:10px;margin-top:12px;align-items:end;flex-wrap:wrap}
.row2 .f{flex:1;min-width:150px}
.go{background:var(--sig);color:var(--on-sig);border:0;border-radius:6px;font:700 20px "Barlow Condensed",Impact,sans-serif;padding:0 26px;height:46px;cursor:pointer;letter-spacing:.3px}
.go:hover{filter:brightness(1.07)}
#msg{margin:18px 2px 8px;color:var(--mute)}
#msg.err{color:var(--bad);font-weight:500}
.t{background:var(--card);border:1px solid var(--line);border-radius:10px;margin:0 0 12px;padding:14px 16px}
.top{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:baseline}
.nm{font-weight:600}.no{color:var(--mute);font-size:14px;margin-left:6px}
.type{font-size:13px;color:var(--mute)}
.times{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;margin:10px 0}
.tm{font:700 32px/1 "Barlow Condensed",Impact,sans-serif}
.tm small{display:block;font:400 13px Barlow,sans-serif;color:var(--mute);margin-top:3px}
.tm.r{text-align:right}
.dur{text-align:center;color:var(--mute);font-size:14px}
.dur i{display:block;height:3px;margin:5px 0;background:repeating-linear-gradient(90deg,var(--ink) 0 10px,transparent 10px 14px);border-radius:2px;opacity:.5}
.meta{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center}
.days{display:flex;gap:3px}
.days span{width:22px;height:22px;border-radius:4px;font-size:12px;font-weight:600;display:grid;place-items:center;color:var(--mute);border:1px solid var(--line)}
.days span.on{background:var(--ok);border-color:var(--ok);color:#fff}
.cls{display:flex;gap:6px}.cls b{font-size:12px;font-weight:600;border:1px solid var(--line);border-radius:4px;padding:1px 6px}
details{margin-top:10px;border-top:1px solid var(--line);padding-top:8px}
summary{cursor:pointer;font-weight:500;font-size:15px}
ol{margin:8px 0 0;padding:0;list-style:none}
li{display:flex;justify-content:space-between;padding:4px 0 4px 16px;position:relative;font-size:15px}
li::before{content:"";position:absolute;left:3px;top:50%;width:7px;height:7px;margin-top:-3.5px;border-radius:50%;background:var(--line)}
li.e::before{background:var(--sig);box-shadow:0 0 0 2px var(--ink)}
li.e{font-weight:600}li.o{opacity:.45}
.note{margin-top:22px;font-size:13px;color:var(--mute)}
@media(max-width:520px){.row{grid-template-columns:1fr}.swap{width:100%;height:38px}h1{font-size:34px}.tm{font-size:28px}}
@media(prefers-reduced-motion:no-preference){.t{animation:in .25s ease-out both}@keyframes in{from{opacity:0;transform:translateY(6px)}}}
</style>
</head>
<body>
<div class="wrap">
<header>
<h1>Find a train</h1>
<p>Enter where you’re starting and where you’re going.</p>
</header>

<div class="panel">
<div class="row">
<div class="f"><label for="src">From</label><input id="src" list="stn" placeholder="e.g. Tirupati" autocomplete="off"></div>
<button class="swap" id="swap" type="button" aria-label="Swap stations">⇄</button>
<div class="f"><label for="dst">To</label><input id="dst" list="stn" placeholder="e.g. Chennai Central" autocomplete="off"></div>
</div>
<div class="row2">
<button class="go" id="go" type="button">Search trains</button>
</div>
</div>
<datalist id="stn"></datalist>

<p id="msg" role="status">Pick two stations to see the trains that run between them.</p>
<button class="go" id="conn" type="button" hidden style="margin-bottom:12px">Connect to database</button>
<div id="out"></div>
<p class="note">Data is read from three database tables: trains, stations and train_stops. Timings are illustrative sample data; confirm on IRCTC or NTES before you travel.</p>
</div>

<script>
const $=id=>document.getElementById(id);
let trains=[],stations=[],stops=[],byName={},sName={};
const fmt=m=>String(Math.floor(m/60)%24).padStart(2,"0")+":"+String(m%60).padStart(2,"0");
const dur=m=>Math.floor(m/60)+"h "+String(m%60).padStart(2,"0")+"m";
function setMsg(t,err){const m=$("msg");m.textContent=t;m.className=err?"err":"";$("conn").hidden=!(err&&!stations.length);}

async function getDb(){for(let i=0;i<50;i++){if(window.claude&&typeof claude.use==="function")return await claude.use("db");await new Promise(r=>setTimeout(r,200));}return null;}
async function connect(){
  try{const p=window.claude&&typeof claude.use==="function"?await claude.use("permissions"):null;if(p)await p.request(["db"]);}catch(e){}
  await load();
}
async function load(){
  setMsg("Loading stations…");
  try{
    const db=await getDb();
    if(!db){setMsg("Not connected to the database. Make sure you’re signed in to Claude, then press Connect to database.",true);return;}
    const [a,b,c]=await Promise.all(["trains","stations","train_stops"].map(n=>db.collection(n).get()));
    trains=a.docs.map(d=>d.data());stations=b.docs.map(d=>d.data()).sort((x,y)=>x.name.localeCompare(y.name));stops=c.docs.map(d=>d.data());
    if(!trains.length){setMsg("The tables are empty. Add rows to trains, stations and train_stops.",true);return;}
    stations.forEach(s=>{byName[s.name.toLowerCase()]=s;sName[s.station_id]=s.name;});
    $("stn").innerHTML=stations.map(s=>`<option value="${s.name}">`).join("");
    setMsg("Pick two stations to see the trains that run between them.");
  }catch(e){setMsg("Couldn’t load the tables ("+(e.message||e.code||"error")+"). Press Connect to database to try again.",true);}
}
function resolve(v){
  v=v.trim().toLowerCase();if(!v)return null;
  if(byName[v])return byName[v];
  const m=stations.filter(s=>s.name.toLowerCase().includes(v));
  return m.length===1?m[0]:null;
}
async function search(){
  const out=$("out");out.innerHTML="";
  if(!stations.length){await load();if(!stations.length)return;}
  const a=resolve($("src").value),b=resolve($("dst").value);
  if(!a||!b){setMsg("Choose both stations from the suggestions: "+stations.map(s=>s.name).join(", ")+".",true);return;}
  if(a.station_id===b.station_id){setMsg("From and To are the same station. Pick a different destination.",true);return;}
  $("src").value=a.name;$("dst").value=b.name;
  const hits=[];
  trains.forEach(t=>{
    const rows=stops.filter(s=>s.train_id===t.train_id).sort((x,y)=>x.stop_order-y.stop_order);
    let day=0,prev=-1;
    const abs=rows.map(r=>{const[h,m]=r.arr.split(":").map(Number);let v=h*60+m;if(v<prev%1440)day++;v+=day*1440;prev=v;return v;});
    const i=rows.findIndex(r=>r.station_id===a.station_id),j=rows.findIndex(r=>r.station_id===b.station_id);
    if(i>=0&&j>i)hits.push({t,rows,abs,i,j,dep:abs[i],arr:abs[j]});
  });
  hits.sort((x,y)=>(x.dep%1440)-(y.dep%1440));
  if(!hits.length){setMsg(`No direct trains found from ${a.name} to ${b.name}. Try a nearby junction such as Renigunta, Gudur or Vijayawada.`,true);return;}
  setMsg(`${hits.length} train${hits.length>1?"s":""} from ${a.name} to ${b.name}.`);
  out.innerHTML=hits.map(h=>{
    const plus=Math.floor(h.arr/1440)-Math.floor(h.dep/1440),n=h.j-h.i-1;
    const li=h.rows.map((r,k)=>`<li class="${k===h.i||k===h.j?"e":k<h.i||k>h.j?"o":""}"><span>${sName[r.station_id]}</span><span>${r.arr}</span></li>`).join("");
    return `<article class="t">
<div class="top"><div><span class="nm">${h.t.name}</span><span class="no">#${h.t.train_id}</span></div></div>
<div class="times">
<div class="tm">${fmt(h.dep)}<small>${a.name}</small></div>
<div class="dur">${dur(h.arr-h.dep)}<i></i>${n} stop${n===1?"":"s"} between</div>
<div class="tm r">${fmt(h.arr)}<small>${b.name}${plus?` (+${plus} day)`:""}</small></div>
</div>
<details><summary>View stops</summary><ol>${li}</ol></details>
</article>`;}).join("");
}
$("go").onclick=search;
$("conn").onclick=connect;
["src","dst"].forEach(id=>$(id).addEventListener("keydown",e=>{if(e.key==="Enter")search();}));
$("swap").onclick=()=>{const s=$("src").value;$("src").value=$("dst").value;$("dst").value=s;};
setMsg("Loading stations…");
load();
</script>
</body>
</html>
